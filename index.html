<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moonshot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Moonshot">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Sora:wght@400;600;700&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
:root{color-scheme:dark;
--bg:#0a0a0a;--card:#161616;--card-hi:#1e1e1e;--thumb:#0f0f0f;
--ink:#ffffff;--ink-soft:#c9c9c9;--ink-muted:#8a8a8a;--line:#2a2a2a;--line-strong:#454545;
--accent:#8fd3ff;--blue:#1a73ff;--on-accent:#0a0a0a;--red:#ff6a5c;--focus:#ffffff;
--r-sm:10px;--r-lg:16px;
--display:Anton,Impact,"Arial Narrow",sans-serif;
--sans:Sora,Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
--pl:max(16px,env(safe-area-inset-left,0px));--pr:max(16px,env(safe-area-inset-right,0px));}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:#0a0a0a;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
.wrap{padding-left:var(--pl);padding-right:var(--pr);padding-block:0 56px;max-width:760px;margin:0 auto;min-width:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-transform:uppercase;margin:0;color:var(--ink);line-height:1;overflow-wrap:anywhere}
p{margin:0}
.dim{color:var(--ink-muted)}
.label{font:600 11px/1.3 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted)}
.gold{color:var(--accent)}

/* hero */
.top{padding-top:calc(env(safe-area-inset-top,0px) + 32px);padding-bottom:22px;display:grid;gap:10px;justify-items:start}
.top h1{font-size:clamp(60px,21vw,120px);letter-spacing:.005em}
.top h1 span{display:block}
.top h1 .sub{color:var(--ink-muted);font-size:max(.62em,14px);margin-top:4px}
.marq{background:#fff;color:#0a0a0a;margin-left:calc(-1*var(--pl));margin-right:calc(-1*var(--pr));padding:10px 16px 9px;text-align:center}
.marq span{font:700 12px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;padding-left:.18em}

/* barra sticky */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);margin-left:calc(-1*var(--pl));margin-right:calc(-1*var(--pr));padding:0 var(--pr) 0 var(--pl);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;min-height:48px;padding:0 12px;text-decoration:none;color:var(--ink-muted);font:700 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;position:relative;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;background:#fff}
.weekrow{padding:10px 0 6px;display:grid;gap:8px}
.weekrow[hidden]{display:none}
.wks{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.wk{font:700 12px/1 var(--sans);min-height:40px;padding:0;border-radius:999px;border:1px solid var(--line-strong);background:transparent;color:var(--ink-soft);cursor:pointer;transition:background .2s,color .2s}
.wk:hover{background:var(--card-hi)}
.wk[aria-pressed="true"]{background:#fff;color:#0a0a0a;border-color:#fff}
.wkline{font:600 11px/1.4 var(--sans);letter-spacing:.12em;color:var(--ink-muted);text-transform:uppercase}
.wkline b{font-weight:700;color:var(--ink)}

/* painéis */
.panel{padding-top:28px;display:grid;gap:24px;align-content:start}
.panel[hidden]{display:none}
.panel.on{animation:rise .4s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.sect h2{font-size:clamp(32px,10vw,52px);line-height:1.02;margin-top:10px}
.lead{color:var(--ink-soft);margin-top:14px;max-width:62ch}
.lead+.lead{margin-top:10px}

/* cartões */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats .card{padding:14px 12px}
.fig{font:400 clamp(22px,7vw,32px)/1.1 var(--display);letter-spacing:.01em;color:var(--ink);margin-top:8px;white-space:nowrap}
.fig small{font:600 11px var(--sans);color:var(--ink-muted);letter-spacing:.06em}
.arrow{color:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border:0;border-radius:var(--r-sm);cursor:pointer;text-decoration:none;font:700 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;background:var(--blue);color:#fff}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px #fff}
.btn.ghost:hover{background:var(--card-hi);filter:none}
.btn.quiet{background:transparent;color:var(--ink-soft);box-shadow:inset 0 0 0 1px var(--line-strong);width:100%}
.btn.quiet:hover{background:var(--card-hi);filter:none}
.btn:active{filter:brightness(.9)}
.btn.sm{min-height:44px;padding:0 18px}

.hoje{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.hoje h2{font-size:clamp(30px,9vw,44px);margin-top:8px}
.hoje .label{display:inline-block;background:var(--accent);color:var(--on-accent);padding:4px 8px 3px;border-radius:4px;letter-spacing:.14em}

.days{display:grid;gap:10px}
.dcard{display:grid;grid-template-columns:56px minmax(0,1fr);gap:2px 12px;align-items:center;text-decoration:none;padding:16px}
.dcard .d{font:700 12px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);grid-row:span 2}
.dcard .n{font:400 clamp(26px,8vw,36px)/1.05 var(--display);text-transform:uppercase;color:var(--ink);overflow-wrap:anywhere}
.dcard .a{font-size:13px;color:var(--ink-muted)}
.dcard:hover{background:var(--card-hi)}

.vol{display:grid;gap:14px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.vrow .g{font-size:14px;color:var(--ink-soft)}
.vrow .v{font:700 13px/1 var(--sans);color:var(--ink)}
.track{grid-column:1/-1;position:relative;height:8px;border-radius:4px;background:#2a2a2a;overflow:hidden}
.track .band{position:absolute;left:50%;right:0;top:0;bottom:0;z-index:1;background:rgba(143,211,255,.3);border-left:1px solid rgba(143,211,255,.7)}
.track .fill{position:absolute;z-index:0;left:0;top:0;bottom:0;border-radius:4px;background:#fff}
.scale{display:flex;justify-content:space-between;font:600 11px/1 var(--sans);color:var(--ink-muted);letter-spacing:.1em}
.small{font-size:13px;color:var(--ink-muted);line-height:1.55}

.phases{display:grid;gap:8px}
.ph{display:grid;grid-template-columns:48px minmax(0,1fr);gap:2px 12px;text-align:left;width:100%;cursor:pointer;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:inherit;font:inherit}
.ph:hover{background:var(--card-hi)}
.ph[aria-pressed="true"]{border-color:#fff;background:var(--card-hi)}
.ph .s{font:400 26px/1 var(--display);color:var(--accent);grid-row:span 3}
.ph .f{font:400 22px/1.1 var(--display);text-transform:uppercase;letter-spacing:.01em}
.ph .i{font:600 11px/1.4 var(--sans);color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase}
.ph .t{font-size:13px;color:var(--ink-muted)}

/* banner da semana */
.banner h2{font-size:clamp(34px,11vw,56px);margin-top:10px}
.banner .int{font:600 12px/1.4 var(--sans);color:var(--ink-soft);margin-top:10px;letter-spacing:.08em;text-transform:uppercase}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.pill{display:inline-block;padding:6px 10px 5px;border-radius:999px;background:var(--accent);color:var(--on-accent);font:700 11px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase}
.banner .small{margin-top:12px}

.daytitle h2{font-size:clamp(44px,14vw,88px);line-height:.98;margin-top:10px}
.daytitle h2 .dim{display:block;font-size:.42em;margin-top:8px;letter-spacing:.04em}
.warm{font-size:13px;color:var(--ink-soft);padding:14px;background:var(--card);border-radius:12px;border:1px solid var(--line)}
.warm span{font:700 11px/1 var(--sans);letter-spacing:.16em;color:var(--accent);text-transform:uppercase;margin-right:8px}

/* exercícios */
.exs{display:grid;gap:10px}
.ex{padding:14px}
.exg{display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 14px;align-items:start}
.ex-head{display:contents}
.no{grid-column:1;grid-row:1/span 4;display:flex;align-items:center;justify-content:center;width:64px;height:64px;background:var(--thumb);border:1px solid var(--line);border-radius:12px;font:400 32px/1 var(--display);color:var(--accent)}
.nm{grid-column:2;font:700 16px/1.3 var(--sans);text-transform:none;color:var(--ink);letter-spacing:0;overflow-wrap:anywhere}
.ex-meta{grid-column:2;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:2px 0 0}
.sr{font:700 14px/1.3 var(--sans);color:var(--ink)}
.sr em{font-style:normal;font-weight:400;color:var(--ink-muted);margin-right:4px}
.tag{display:inline-block;padding:4px 8px 3px;border-radius:4px;font:700 11px/1.2 var(--sans);letter-spacing:.1em;text-transform:uppercase;background:var(--accent);color:var(--on-accent)}
.tag.plus{background:#fff;color:#0a0a0a}
.tag.knee{background:transparent;border:1px solid var(--red);color:var(--red)}
.tag.mute{background:transparent;border:1px solid var(--line-strong);color:var(--ink-soft)}
.note{grid-column:2;margin:2px 0 0;font-size:12.5px;line-height:1.5;color:var(--ink-muted);overflow-wrap:anywhere}
.log{grid-column:1/-1;display:grid;gap:12px;margin:12px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.boxes{display:flex;flex-wrap:wrap;gap:10px}
.cb{position:relative;display:block}
.cb input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.cb span{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:12px;border:1.5px solid var(--line-strong);font:700 14px/1 var(--sans);color:var(--ink-muted);background:transparent;transition:background .15s,color .15s,border-color .15s}
.cb input:active+span{transform:scale(.92);border-color:#fff;background:var(--card-hi)}
.cb input:checked:active+span{background:var(--accent);border-color:var(--accent)}
.cb input:checked+span{background:#fff;color:#0a0a0a;border-color:#fff}
.cb input:focus-visible+span{outline:2px solid var(--focus);outline-offset:3px}
.cb.wide span{width:auto;min-width:52px;padding:0 14px}
.kg{display:flex;align-items:center;gap:10px;font:600 11px/1 var(--sans);letter-spacing:.14em;color:var(--ink-muted);text-transform:uppercase}
.kg input{flex:0 1 130px;min-width:96px;width:130px;height:48px;padding:0 12px;text-align:right;background:transparent;border:1px solid var(--line);border-radius:10px;color:var(--ink);font:600 15px/1 var(--sans);font-variant-numeric:tabular-nums}
.kg input:focus{border-color:#fff}
.kg input::placeholder{color:var(--ink-muted);opacity:1}
.kg .prevkg{font:600 12px/1.3 var(--sans);letter-spacing:0;text-transform:none;color:var(--ink-muted)}
.ex.done{border-color:rgba(143,211,255,.55);background:linear-gradient(0deg,rgba(143,211,255,.06),rgba(143,211,255,.06)),var(--card)}
.ex.done .no{border-color:var(--accent)}
.prog{display:none;padding:6px 0 8px}
.prog.on{display:grid;gap:6px}
.prog-t{font:600 12px/1 var(--sans);color:var(--ink-soft);letter-spacing:.04em}
.prog-t b{color:var(--ink);font-weight:700}
.prog-l{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.prog-l i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.fin{padding:16px;border:1px solid rgba(143,211,255,.55);border-radius:12px;background:rgba(143,211,255,.08);text-align:center}
.fin h3{font-size:30px;color:var(--accent)}
.fin p{font-size:13px;color:var(--ink-soft);margin-top:6px}
.after{font-size:13px;color:var(--ink-muted);padding:2px 2px 0}
.after b{font:700 11px/1 var(--sans);letter-spacing:.16em;color:var(--accent);text-transform:uppercase;margin-right:8px}
.after a{color:var(--ink)}

.clear{display:grid;gap:10px;justify-items:stretch}
.confirm{width:100%;padding:16px;border:1px solid var(--line-strong);border-radius:12px;background:var(--card)}
.confirm[hidden]{display:none}
.confirm p{font-size:14px;color:var(--ink-soft);margin-bottom:12px}
.confirm .row{display:flex;gap:8px;flex-wrap:wrap}

.sel{display:grid;gap:10px}
.opt{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.opt.cur{border-color:#fff;background:var(--card-hi)}
.opt .t{font:400 28px/1.1 var(--display);text-transform:uppercase;margin-top:8px}
.opt .d{font-size:13px;color:var(--ink-soft);margin-top:4px}
.tiros{font:400 64px/1 var(--display);color:var(--accent)}

.rules{display:grid;gap:10px}
.rule-i{display:grid;grid-template-columns:40px minmax(0,1fr);gap:6px 12px}
.rule-i .k{font:400 26px/1 var(--display);color:var(--accent)}
.rule-i h3{font:400 28px/1.05 var(--display)}
.rule-i p{grid-column:2;color:var(--ink-soft);font-size:14px}
.rule-i ul{grid-column:2;margin:4px 0 0;padding-left:18px;color:var(--ink-soft);font-size:14px}
.rule-i li{margin:6px 0}

.foot{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);display:grid;gap:6px}
.foot p{font-size:13px;color:var(--ink-muted)}


/* topo compacto fora da Visão */
body:not([data-t="visao"]) .marq{display:none}
body:not([data-t="visao"]) .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:10px;text-align:left}
body:not([data-t="visao"]) .top h1{font-size:22px;line-height:1}
body:not([data-t="visao"]) .top h1 span{display:inline}
body:not([data-t="visao"]) .top h1 .sub{font-size:14px;margin:0 0 0 8px}
body:not([data-t="visao"]) .panel{padding-top:16px;gap:16px}
body:not([data-t="visao"]) .banner{padding:14px}
body:not([data-t="visao"]) .banner h2{font-size:clamp(28px,8vw,40px);margin-top:6px}
body:not([data-t="visao"]) .banner .int{margin-top:6px}
body:not([data-t="visao"]) .banner .pills{margin-top:10px}
body:not([data-t="visao"]) .daytitle h2{font-size:clamp(34px,10vw,52px);margin-top:0}
/* visão */
body:not([data-t="visao"]) .vonly{display:none}
.top{justify-items:center;text-align:center}
.lvl{display:inline-flex;align-items:center;gap:8px;background:#161616;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font:600 13px/1 var(--sans);letter-spacing:.06em;color:var(--ink)}
.intro{display:grid;gap:18px;justify-items:center;text-align:center}
.tagline{color:var(--ink-soft);font-size:16px;max-width:30ch}
.pillbtn{font:600 13px/1 var(--sans);letter-spacing:.06em;color:var(--ink);background:#161616;border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 18px;cursor:pointer}
.pillbtn:hover{background:var(--card-hi)}
.pillbtn .chev{display:inline-block;margin-left:6px;transition:transform .2s}
.pillbtn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.wkpick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%;max-width:420px}
.wkpick[hidden]{display:none}
.wkp{display:grid;gap:4px;justify-items:center;min-height:64px;padding:10px 4px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink);cursor:pointer;font:inherit}
.wkp:hover{background:var(--card-hi)}
.wkp b{font:400 24px/1 var(--display);color:var(--accent)}
.wkp span{font:600 10px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);overflow-wrap:anywhere}
.wkp[aria-pressed="true"]{border-color:#fff;background:var(--card-hi)}
.wkp[aria-pressed="true"] b{color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;margin-top:6px}
.kpis>div{display:grid;gap:4px;padding:6px 4px;justify-items:center}
.kpis>div+div{border-left:1px solid var(--line-strong)}
.kpis b{font:700 clamp(22px,7vw,30px)/1.1 var(--sans);color:var(--ink)}
.kpis span{font-size:13px;color:var(--ink-muted)}
.vtabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.vtabs button{background:transparent;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;min-height:52px;font:600 15px/1 var(--sans);color:var(--ink-muted);cursor:pointer}
.vtabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:#fff}
.sect.compact h2{font-size:clamp(26px,8vw,36px)}
#periodo{scroll-margin-top:120px}
.drow{display:grid;grid-template-columns:80px minmax(0,1fr);gap:16px;align-items:center;text-decoration:none;padding:14px 0;border-bottom:1px solid var(--line)}
.drow:hover .dn{color:var(--accent)}
.sq{width:80px;height:80px;border-radius:12px;background:#161616;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.sq .ab{font:400 32px/1 var(--display);text-transform:uppercase}
.dt{display:grid;gap:3px;min-width:0}
.dn{font:700 clamp(18px,5.5vw,22px)/1.2 var(--sans);color:var(--ink);overflow-wrap:anywhere}
.dm{font-size:14px;color:var(--ink-muted)}
.ds{font-size:12px;color:var(--ink-muted);opacity:.85}
.hoje-tag{display:inline-block;vertical-align:middle;font:700 11px/1 var(--sans);font-style:normal;letter-spacing:.12em;text-transform:uppercase;background:var(--accent);color:var(--on-accent);padding:4px 7px 3px;border-radius:4px;margin-left:6px}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:55;display:flex;align-items:center;justify-content:center;margin:0 auto;max-width:760px;width:calc(100% - var(--pl) - var(--pr));left:var(--pl);right:var(--pr);min-height:56px;margin-bottom:max(12px,env(safe-area-inset-bottom,0px));background:#fff;color:#0a0a0a;border-radius:14px;text-decoration:none;font:700 16px/1 var(--sans);box-shadow:0 0 0 12px #0a0a0acc,0 -8px 24px 12px #0a0a0acc}
.cta[hidden]{display:none}
.dock{position:fixed;bottom:0;z-index:55;left:var(--pl);right:var(--pr);max-width:760px;margin:0 auto max(12px,env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:8px;box-shadow:0 0 0 12px #0a0a0acc,0 -8px 24px 12px #0a0a0acc;border-radius:14px;background:#0a0a0acc}
.dock[hidden]{display:none}
.dock.run{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.dock button,.dock .tbox{min-height:56px;border-radius:14px;border:0;font:700 16px/1 var(--sans);cursor:pointer}
.dock .go{background:#fff;color:#0a0a0a}
.dock .ok{background:var(--blue);color:#fff}
.dock .tbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--card);border:1px solid var(--line-strong);cursor:default}
.dock .tbox small{font:600 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted)}
.dock .tbox b{font:400 26px/1 var(--display);letter-spacing:.03em;color:var(--accent)}
.feito{display:grid;gap:10px}
.feito .btn{width:100%;min-height:56px;font-size:14px}

.back{display:none}
.tabs{display:none!important}

body[data-day="1"] .top,body[data-day="1"] .weekrow{display:none!important}
.more{display:grid;gap:8px;margin-top:4px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-decoration:none}
.mrow:hover{background:var(--card-hi)}
.mrow b{font:700 15px/1.3 var(--sans);color:var(--ink)}
.mrow span{font-size:13px;color:var(--ink-muted);text-align:right}
body[data-day="1"] .bar{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;padding-top:env(safe-area-inset-top,0px)}
body[data-day="1"] .back{display:inline-flex;align-items:center;gap:6px;min-height:52px;padding-right:8px;text-decoration:none;font:700 13px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
body[data-day="1"] .back svg{margin-left:-4px}
body[data-day="1"] .prog{padding:0;justify-items:end}
body[data-day="1"] .prog-l{width:min(140px,100%)}
body[data-day="1"] .panel{padding-top:20px}
/* check por exercício */
.log{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.xk{position:relative;display:block;margin-left:auto}
.xk input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.xk span{display:flex;align-items:center;gap:8px;min-height:52px;padding:0 18px 0 14px;border-radius:12px;border:1.5px solid var(--line-strong);font:700 13px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);transition:background .15s,color .15s,border-color .15s,transform .1s}
.xk input:active+span{transform:scale(.95)}
.xk input:checked+span{background:#fff;border-color:#fff;color:#0a0a0a}
.xk input:focus-visible+span{outline:2px solid var(--focus);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.top,.panel,.exs,.days,.vol,.phases,.sel,.rules,.clear,.weekrow,.foot{grid-template-columns:minmax(0,1fr)}.warm,.note,.nm{overflow-wrap:anywhere}

var DAYS={
 seg:{name:"Superior A",focus:"costas pesado",cardio:"caminhada inclinada 15–20 min",cd:"10–12% de inclinação, 5–5,5 km/h, sem segurar no corrimão",warm:"trunk",items:[

 {name:"Abdominal declinado com anilha",s:3,r:"10–15",T:1,k:13,note:"Parte de cima do abdômen. Enrola a coluna, não só sobe o tronco. Desce até esticar o abdômen."},

function $(id){return document.getElementById(id)}
function pad(n){return n<10?"0"+n:""+n}
function key(w,day,n,part){return "b1:s"+w+":"+day+":"+n+":"+part}
function setsFor(it,w){
  var n=it.s;
  if(w===5)n=Math.ceil(n/2);
  else if((w===6||w===7)&&it.L)n=n+1;
  return n;
}
function tirosFor(w){
  var t={1:2,2:2,3:2,4:3,5:1,6:3,7:3,8:3};
  return {n:t[w]};
}
function tecnicaOn(w){return w===4||w===7||w===8}
function doneKey(w,day){return "b1:s"+w+":"+day+":done"}
function isDone(w,day){return !!sget(doneKey(w,day))}
function getTimer(){try{var t=JSON.parse(sget("b1:timer")||"null");return t&&t.start?t:null}catch(e){return null}}
function fmt(ms){var t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),x=t%60;return h?h+":"+pad(m)+":"+pad(x):pad(m)+":"+pad(x)}
function durTxt(v){var m=parseInt(v,10);return m>0?(m>=60?Math.floor(m/60)+" h "+pad(m%60)+" min":m+" min"):""}

/* ---------- peças ---------- */
function checks(prefixId,w,day,n,count,wide,label){
  var h="";
  for(var i=1;i<=count;i++){
    var id="ck-"+prefixId+"-"+i;
    var on=sget(key(w,day,n,"c"+i))==="1";
    h+='<label class="cb'+(wide?" wide":"")+'"><input type="checkbox" id="'+id+'" data-k="'+key(w,day,n,"c"+i)+'" aria-label="'+label+' '+i+' de '+count+'"'+(on?" checked":"")+'><span aria-hidden="true">'+i+'</span></label>';
  }
  return h;
}
/* um check por exercício (aceita também marcações antigas por série) */
function exCheck(w,day,n,oldCount,name){
  var k=key(w,day,n,"ok"),on=sget(k)==="1";
  if(!on&&oldCount){on=true;for(var i=1;i<=oldCount;i++)if(sget(key(w,day,n,"c"+i))!=="1"){on=false;break}}
  return '<label class="xk"><input type="checkbox" data-k="'+k+'" aria-label="Exercício feito: '+String(name).replace(/"/g,"")+'"'+(on?" checked":"")+'><span aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Feito</span></label>';
}
function kgField(prefixId,w,day,n,name,unit){
  var u=unit||"kg",uLab=u==="kg"?"Carga em kg":(u==="min"?"Tempo em minutos":"Repetições");
  var v=sget(key(w,day,n,"kg"))||"";
  var prev=w>1?(sget(key(w-1,day,n,"kg"))||"").replace(/["<>&]/g,""):"";
  return '<label class="kg" for="kg-'+prefixId+'">'+u+' <input type="text" inputmode="decimal" autocomplete="off" maxlength="7" id="kg-'+prefixId+'" data-k="'+key(w,day,n,"kg")+'" value="'+v.replace(/"/g,"")+'"'+(prev?' placeholder="'+prev+'"':'')+' aria-label="'+uLab+': '+name.replace(/"/g,"")+(prev?'. Semana anterior: '+prev+' '+u:'')+'">'+(prev?'<span class="prevkg">S'+(w-1)+': '+prev+' '+u+'</span>':'')+'</label>';
}
function exercise(it,idx,w,day,useWeek){
  var wk=useWeek?w:0;
  var n=it.k||idx+1, shown=idx+1, count=setsFor(it,w);
  if(!useWeek)count=it.s;
  var pid=(useWeek?"s"+w:"s0")+"-"+day+"-"+n;

    if((w===6||w===7)&&it.L)tags+='<span class="tag plus">+1 série</span>';
    if(tecnicaOn(w)&&it.D)tags+='<span class="tag">drop triplo</span>';
    else if(tecnicaOn(w)&&it.T)tags+='<span class="tag">técnica</span>';
  }
  if(it.J)tags+='<span class="tag knee">joelho: sobram 2 sempre</span>';
  if(it.tag)tags+='<span class="tag mute">'+it.tag+'</span>';
  var h='<article class="card ex exg"><div class="ex-head"><span class="no">'+pad(shown)+'</span><h3 class="nm">'+it.name+'</h3></div>';
  h+='<div class="ex-meta"><span class="sr"><em>Séries:</em> '+count+' × '+it.r+'</span>'+tags+'</div>';

  return h;
}

  return '<section class="card banner"><span class="label">Semana '+w+' de 8 · '+W.f+'</span><h2>S'+w+' <span class="dim">'+W.f+'</span></h2>'+

  var tk=todayKey();
  var pick='';
  for(var k=1;k<=8;k++)pick+='<button type="button" class="wkp" data-week="'+k+'" aria-pressed="'+(week===k)+'" aria-label="Semana '+k+', '+WEEKS[k-1].f+'"><b>S'+k+'</b><span>'+WEEKS[k-1].f.replace("Intensificação","Intensif.")+'</span></button>';
  h+='<section class="intro">'+
   '<button type="button" class="pillbtn" data-act="pick" aria-expanded="false" aria-controls="wkpick">Semana '+week+' · '+WEEKS[week-1].f+'<span class="chev" aria-hidden="true">&rsaquo;</span></button>'+
   '<div class="wkpick" id="wkpick" hidden>'+pick+'</div>'+
   '<div class="kpis"><div><b>5x</b><span>por semana</span></div><div><b>8</b><span>semanas</span></div><div><b>60–75</b><span>minutos</span></div></div></section>';
  h+='<div class="vtabs" role="group" aria-label="Visão"><button type="button" data-vt="geral" aria-pressed="'+(vtab==="geral")+'">Visão geral</button><button type="button" data-vt="dias" aria-pressed="'+(vtab==="dias")+'">Dias</button></div>';
  h+='<div class="days">';
    DAYKEYS.forEach(function(k){
      var d=DAYS[k],sub,dur=d?"60–75 min":DUR[k];
      if(d){sub=(d.focus?d.focus+" · ":"")+"Aeróbico: "+d.cardio}
      else if(k==="sab"){sub="Desafio de barra, paralelas, abdômen e cardio"}
      else{sub="Tiros na bike"}
      var ok=isDone(week,k),num=pad(DAYKEYS.indexOf(k)+1);
      h+='<a class="drow'+(ok?' isdone':'')+'" href="#'+k+'"><span class="sq'+(ok?' ok':'')+'">'+(ok?'<svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-label="Feito"><path d="M5 12.5l4.5 4.5L19 7"/></svg>':'<span class="ab">'+num+'</span>')+'</span><span class="dt"><span class="dn">'+dayName(k)+'</span><span class="dm">'+(ok&&durTxt(sget(doneKey(week,k)))?'Feito em '+durTxt(sget(doneKey(week,k))):dur)+'</span><span class="ds">'+sub+'</span></span></a>';
    });
    h+='</div>';
  h+='<div class="more"><a class="mrow" href="#flex"><b>Flexibilidade</b><span>10 min no fim de todo treino</span></a><a class="mrow" href="#regras"><b>Regras</b><span>Progressão, descanso, técnica, joelho</span></a></div>';
  if(vtab==="geral"){
  h+='<section class="sect" id="periodo"><span class="label">Periodização</span><h2><span class="dim">Oito semanas,</span> quatro fases</h2>'+
   '<p class="lead">"Sobram X" quer dizer quantas repetições ainda caberiam antes da falha. Toque numa semana para usá-la.</p></section>';
  h+='<div class="phases">';
  WEEKS.forEach(function(W,i){
    h+='<button type="button" class="ph" data-week="'+(i+1)+'" aria-pressed="'+(week===i+1)+'"><span class="s">S'+(i+1)+'</span><span class="f">'+W.f+'</span><span class="i">'+W.i+'</span>'+(W.t?'<span class="t">'+W.t+'</span>':'<span class="t">&nbsp;</span>')+'</button>';
  });
  h+='</div>';
  h+='<p class="small">Técnica, só em máquina e cabo. Veja como fazer em <a class="gold" href="#regras">Regras</a>.</p>';
  h+='<section class="sect"><span class="label">Volume</span><h2><span class="dim">Séries por semana</span> em cada grupo</h2></section>';
  h+='<div class="card vol">';
  VOL.forEach(function(v){
    h+='<div class="vrow"><span class="g">'+v[0]+'</span><span class="v">'+v[1]+'</span><div class="track"><div class="band"></div><div class="fill" style="width:'+(v[2]/20*100)+'%"></div></div></div>';
  });
  h+='<div class="scale"><span>0</span><span>10</span><span>20 séries</span></div><p class="small">A faixa destacada, de 10 a 20, é a que a pesquisa indica para quem já treina.</p></div>';
  }
  return h;
}

/* ---------- dias ---------- */
function viewDay(day){
  var i=DAYKEYS.indexOf(day),h=banner(week);
  var d=DAYS[day];
  if(d){
    h+=dayHead(day,i,d)+warmup(d.warm)+'<div class="exs">';
    d.items.forEach(function(it,ix){h+=exercise(it,ix,week,day,true)});
    h+='</div><p class="after"><b>Depois</b>'+d.cardio+(d.cd?' ('+d.cd+')':'')+' + <a href="#flex">flexibilidade</a>.</p>'+feitoBlock(day);
  }else if(day==="sab"){
    h+=dayHead(day,i,{name:"Atlético 1",focus:""})+'<div class="exs">';
    var forte=week>=3;
    var sabList=(week===2||week===8)?[TESTE].concat(SAB):SAB;
    sabList.forEach(function(it,ix){h+=exercise(it,ix,week,day,true)});
    h+='<article class="card ex exg"><div class="ex-head"><span class="no">'+pad(sabList.length+1)+'</span><h3 class="nm">Cardio em 3 aparelhos</h3></div><div class="ex-meta"><span class="sr">30 min</span><span class="tag mute">ritmo de conversa</span>'+(forte?'<span class="tag">últimos 5 min fortes</span>':'')+'</div>'+
     '<p class="note">10 min de bike, 10 de caminhada inclinada, 10 de elíptico. Troca de aparelho sem parar. '+(forte?'Nesta semana, os últimos 5 min fortes no elíptico.':'A partir da S3, os últimos 5 min fortes no elíptico.')+'</p>'+
     '<div class="log">'+exCheck(week,"sab",1,1,"Cardio em 3 aparelhos")+'</div></article>';
    h+='<article class="card ex exg"><div class="ex-head"><span class="no">'+pad(sabList.length+2)+'</span><h3 class="nm">Mobilidade longa</h3></div><div class="ex-meta"><span class="sr">2 × ~20 min</span></div>'+
     '<p class="note">Rotina de flexibilidade 2 vezes. Veja a aba <a class="gold" href="#flex">Flex</a>.</p>'+
     '<div class="log">'+exCheck(week,"sab",2,2,"Mobilidade longa")+'</div></article></div>'+feitoBlock(day);
  }else{
    var T=tirosFor(week);
    h+=dayHead(day,i,{name:"Atlético 2",focus:""});
    h+='<div class="sel"><div class="opt cur"><span class="label">Toda semana · só bike</span><div class="t">1 rodada = 4 min</div><div class="d">8 tiros de 20 s no máximo, com 10 s parado entre eles. Entre uma rodada e outra, 3 min pedalando leve.</div></div></div>';
    h+='<article class="card ex"><span class="label">S'+week+' · bike</span><div class="tiros" style="margin-top:10px">'+T.n+' <span class="dim" style="font-size:18px;letter-spacing:0">'+(T.n===1?"rodada":"rodadas")+'</span></div>'+
     '<p class="note" style="margin-left:0">S1 a S3: 2 rodadas. S4 em diante: 3. Na S5, semana leve: 1. Antes, 5 min de bike leve; depois, mais 5. Se o joelho incomodar, menos carga na bike e mais giro.</p>'+
     '<div class="log" style="margin-left:0">'+exCheck(week,"dom",1,T.n,"Rodadas de tiros")+'</div></article>';
    h+='<p class="after"><b>Depois</b>rotina de <a href="#flex">flexibilidade</a>.</p>'+feitoBlock(day);
  }
  return h;
}

/* ---------- regras ---------- */
function viewRegras(){
  var R=[
   ["Progressão","Bateu o topo da faixa em todas as séries? Sobe a carga na semana seguinte."],
   ["Descanso","2–3 min nos pesados. 60–90 s nos isolados."],
   ["Aquecimento","5 min de bike. Nos dias de tronco, mais 2 × 15 de rotação externa no cabo."],
   ["Descida","Desça sempre em 2–3 s, sentindo o músculo alongar. É na parte alongada que o músculo mais cresce."],
   ["Elevação lateral","Só até a linha do ombro, com o polegar levemente para cima."]
  ];
  var h='<section class="sect"><span class="label">Regras</span><h2><span class="dim">Poucas regras,</span> sempre valem</h2></section><div class="rules">';
  R.forEach(function(r,i){h+='<div class="card rule-i"><span class="k">'+pad(i+1)+'</span><h3>'+r[0]+'</h3><p>'+r[1]+'</p></div>'});
  h+='<div class="card rule-i"><span class="k">06</span><h3>Técnica</h3><p>Só em máquina e cabo. Escolha uma das duas.</p><ul><li><b class="gold" style="font-weight:500">Parciais no alongado.</b> Ao falhar, faça mais 5–8 meias repetições na parte em que o músculo está esticado.</li><li><b class="gold" style="font-weight:500">Drop set.</b> Tire 25% da carga e continue até falhar.</li></ul></div>';
  h+='<div class="card rule-i" style="border-color:rgba(255,106,92,.4)"><span class="k" style="color:var(--red)">07</span><h3>Joelho</h3><ul><li>Nos pesados de perna, sempre sobram pelo menos 2 repetições, em todas as semanas.</li><li>Nada de salto, giro ou mudança de direção.</li><li>Se o joelho falsear, inchar ou doer mais no dia seguinte, reduza 20% da carga.</li><li>Mostre esta parte ao ortopedista ou fisioterapeuta.</li><li>Quando o joelho for operado, perna e aeróbico mudam.</li></ul></div>';
  h+='</div>';
  return h;
}

/* ---------- flex ---------- */
function viewFlex(){
  var h='<section class="sect"><span class="label">Flexibilidade</span><h2><span class="dim">Dez minutos</span> no fim de todo treino</h2>'+
   '<p class="lead">Trinta segundos por vez, repetidos quase todo dia, é o que funciona. Quem é mais encurtado melhora mais rápido.</p></section><div class="exs">';
  FLEX.forEach(function(it,ix){h+=exercise(it,ix,0,"flex",false)});
  h+='</div>'+clearBlock("flex","esta rotina");
  return h;
}

function updateProgress(){
  var panel=panels[cur],pg=$("prog");
  if(!panel)return;
  var cards=panel.querySelectorAll(".ex"),total=0,done=0;
  for(var i=0;i<cards.length;i++){
    var bx=cards[i].querySelectorAll('input[type=checkbox]');
    if(!bx.length)continue;
    var all=true;for(var j=0;j<bx.length;j++)if(!bx[j].checked){all=false;break}
    total++;if(all)done++;
    cards[i].classList.toggle("done",all);
  }
  var isDay=DAYKEYS.indexOf(cur)>=0&&total>0;
  pg.classList.toggle("on",isDay);
  if(isDay){
    $("prog-t").innerHTML='<b>'+done+'</b> de '+total+(total===1?' exercício':' exercícios');
    $("prog-i").style.width=(done/total*100)+"%";
  }

}

/* ---------- montagem ---------- */
var main=$("main"),panels={};
TABS.forEach(function(t){
  var p=document.createElement("section");p.className="panel";p.id="p-"+t[0];p.hidden=true;main.appendChild(p);panels[t[0]]=p;
  var a=document.createElement("a");a.className="tab";a.href="#"+t[0];a.textContent=t[1];a.setAttribute("data-t",t[0]);$("tabs").appendChild(a);
});
var wks=$("wks");
for(var i=1;i<=8;i++){var b=document.createElement("button");b.type="button";b.className="wk";b.setAttribute("data-w",i);b.id="wk-"+i;b.textContent="S"+i;b.setAttribute("aria-label","Semana "+i);wks.appendChild(b)}

function renderWeekBar(){
  var btns=wks.children;
  for(var i=0;i<btns.length;i++)btns[i].setAttribute("aria-pressed",(i+1===week)?"true":"false");
  var W=WEEKS[week-1];
  $("wkline").innerHTML='<b>S'+week+'</b> · '+W.f+' · '+W.i;
}
function renderPanel(id){
  var h="";
  if(id==="visao")h=viewVisao();
  else if(id==="regras")h=viewRegras();
  else if(id==="flex")h=viewFlex();
  else h=viewDay(id);
  panels[id].innerHTML=h;
}
function show(id,animate){
  if(!panels[id])id="visao";
  cur=id;
  renderPanel(id);
  TABS.forEach(function(t){
    var on=t[0]===id;panels[t[0]].hidden=!on;panels[t[0]].classList.remove("on");
  });
  if(animate!==false)void panels[id].offsetWidth;
  panels[id].classList.add("on");
  var tabs=$("tabs").children,act=null;
  for(var i=0;i<tabs.length;i++){
    if(tabs[i].getAttribute("data-t")===id){tabs[i].setAttribute("aria-current","page");act=tabs[i]}else tabs[i].removeAttribute("aria-current");
  }
  if(act){var c=$("tabs");c.scrollLeft=act.offsetLeft-(c.clientWidth-act.offsetWidth)/2}
  $("weekrow").hidden=DAYKEYS.indexOf(id)<0;
  renderWeekBar();
  document.body.setAttribute("data-t",id);
  document.body.setAttribute("data-day",id!=="visao"?"1":"0");
  var cta=$("cta");cta.hidden=id!=="visao";
  updateProgress();
  if(id==="visao"){
    var tm=getTimer(),nx=null;
    if(tm){cta.href="#"+tm.day;cta.innerHTML='Em andamento: '+dayName(tm.day)+' · <span class="tmr" style="margin-left:6px">'+fmt(Date.now()-tm.start)+'</span>'}
    else cta.hidden=true;
  }
  renderDock();
}
function renderDock(){
  var dk=$("dock"),isDay=DAYKEYS.indexOf(cur)>=0;
  if(!isDay||isDone(week,cur)){dk.hidden=true;return}
  dk.hidden=false;
  var tm=getTimer();
  if(tm&&tm.day===cur&&tm.week===week){
    dk.className="dock run";
    dk.innerHTML='<div class="tbox" role="timer" aria-label="Tempo de treino"><small>Tempo</small><b class="tmr">'+fmt(Date.now()-tm.start)+'</b></div><button type="button" class="ok" data-act="done" data-day="'+cur+'">Feito!</button>';
  }else{
    dk.className="dock";
    dk.innerHTML='<button type="button" class="go" data-act="start">Começar treino</button>';
  }
}
setInterval(function(){
  var tm=getTimer();if(!tm)return;
  var els=document.querySelectorAll(".tmr");for(var i=0;i<els.length;i++)els[i].textContent=fmt(Date.now()-tm.start);
},1000);
function route(){
  var h=(location.hash||"").replace("#","");
  if(!h)h="visao";
  show(h);
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",function(){route()});

function setWeek(w){
  week=w;
  try{sset("b1:week",String(w))}catch(e){}
  show(cur,false);
}

/* ---------- eventos ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest?e.target.closest("button,a"):null;
  if(!t)return;
  if(t.hasAttribute("data-w")){setWeek(parseInt(t.getAttribute("data-w"),10));return}
  if(t.hasAttribute("data-vt")){vtab=t.getAttribute("data-vt");show(cur,false);var sc=t.getAttribute("data-scroll");if(sc){var el=$(sc);if(el)el.scrollIntoView()}return}
  if(t.hasAttribute("data-week")){setWeek(parseInt(t.getAttribute("data-week"),10));return}
  var act=t.getAttribute("data-act");
  if(act==="start"){sset("b1:timer",JSON.stringify({day:cur,week:week,start:Date.now()}));renderDock();return}
  if(act==="done"){
    var dd=t.getAttribute("data-day"),tm2=getTimer(),mins="0";
    if(tm2&&tm2.day===dd&&tm2.week===week){mins=String(Math.max(1,Math.round((Date.now()-tm2.start)/60000)));sdel("b1:timer")}
    sset(doneKey(week,dd),mins);show(cur,false);window.scrollTo(0,document.body.scrollHeight);return}
  if(act==="undone"){sdel(doneKey(week,t.getAttribute("data-day")));show(cur,false);return}
  if(act==="pick"){var pk=$("wkpick"),op=pk.hidden;pk.hidden=!op;t.setAttribute("aria-expanded",String(op));return}
  if(act==="ask"){var c=t.parentNode.querySelector(".confirm");c.hidden=false;var y=c.querySelector("[data-act=yes]");y.focus();return}
  if(act==="no"){var c2=t.closest(".confirm");c2.hidden=true;c2.parentNode.querySelector("[data-act=ask]").focus();return}
  if(act==="yes"){
    var day=t.getAttribute("data-day");
    sclear("b1:s"+(day==="flex"?0:week)+":"+day+":");
    show(cur,false);
    return;
  }
});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el&&el.type==="checkbox"&&el.getAttribute("data-k")){
    var dk2=el.getAttribute("data-k");
    if(el.checked)sset(dk2,"1");else{sdel(dk2);if(/:ok$/.test(dk2)){var base=dk2.slice(0,-2);for(var ci=1;ci<=20;ci++)sdel(base+"c"+ci)}}
    updateProgress();
  }
});
document.addEventListener("input",function(e){
  var el=e.target;
  if(el&&el.type==="text"&&el.getAttribute("data-k")){
    var v=el.value.trim();
    if(v)sset(el.getAttribute("data-k"),v);else sdel(el.getAttribute("data-k"));
  }
});

$("backname").textContent=PROGRAM;$("backname").parentNode.setAttribute("aria-label","Voltar para "+PROGRAM);
route();
})();
</script>
<script>
try{if('serviceWorker' in navigator){window.addEventListener('load',function(){var had=!!navigator.serviceWorker.controller,rl=false;navigator.serviceWorker.addEventListener('controllerchange',function(){if(had&&!rl){rl=true;location.reload()}});navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(function(r){r.update();document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')r.update()})}).catch(function(){})})}}catch(e){}
</script>
</body>
